<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz des départements français</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f1f5f9;
    color: #17202a;
}

header {
    background: #173f67;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.stats {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.stat {
    background: #edf2f7;
    padding: 8px 12px;
    border-radius: 10px;
}

.progress {
    height: 8px;
    background: #dce3ea;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: #1769aa;
    transition: width .3s;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.mode {
    width: 100%;
    margin: 5px 0;
    background: #1769aa;
    color: white;
}

.secondary {
    background: #e8eef5;
    color: #173f67;
}

#question {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 20px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.answer {
    background: #edf2f7;
    text-align: left;
}

.answer.correct {
    background: #d8f3dc;
    color: #176b2c;
}

.answer.wrong {
    background: #fde0e0;
    color: #9b2226;
}

.answer:disabled {
    opacity: 1;
}

#feedback {
    min-height: 30px;
    margin-top: 15px;
    font-weight: 700;
}

.hidden {
    display: none;
}

.proposition {
    background: #f1f4f7;
    padding: 11px;
    border-radius: 10px;
    margin: 7px 0;
}

.proposition.correct {
    background: #d8f3dc;
}

.fiche {
    background: #f8fafc;
    border-left: 5px solid #1769aa;
    padding: 17px;
    border-radius: 10px;
    margin-top: 20px;
}

.fiche h3 {
    margin-top: 0;
}

.fiche p {
    line-height: 1.5;
}

.fiche a {
    display: inline-block;
    background: #173f67;
    color: white;
    text-decoration: none;
    padding: 10px 13px;
    border-radius: 10px;
    margin-top: 5px;
}

@media(max-width:650px) {
    .answers {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🇫🇷 Quiz des départements français</h1>
</header>

<main>

<div class="card">

    <div class="stats">
        <div class="stat">
            Question <b id="questionNumber">0</b>/<span id="totalQuestions">20</span>
        </div>

        <div class="stat">
            Score <b id="score">0</b>
        </div>

        <div class="stat">
            Série <b id="streak">0</b>
        </div>

        <div class="stat">
            Départements vus <b id="seen">0</b>/101
        </div>
    </div>

    <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
    </div>

</div>


<!-- MENU -->

<div id="menu" class="card">

<h2>Choisis ton mode de quiz</h2>

<button class="mode" onclick="startQuiz('prefecture')">
🏛️ Département → préfecture
</button>

<button class="mode" onclick="startQuiz('department')">
📍 Ville → département
</button>

<button class="mode" onclick="startQuiz('subprefecture')">
🏢 Sous-préfecture → département
</button>

<button class="mode" onclick="startQuiz('status')">
❓ Préfecture ou sous-préfecture ?
</button>

<button class="mode" onclick="startQuiz('mixed')">
🎯 Défi mixte
</button>

</div>


<!-- QUIZ -->

<div id="quiz" class="card hidden">

<div id="question"></div>

<div id="answers" class="answers"></div>

<div id="feedback"></div>


<div id="correction" class="hidden">

<h3>📋 Les quatre propositions</h3>

<div id="propositions"></div>

<div id="fiche" class="fiche"></div>

</div>


<button
    id="nextButton"
    class="mode hidden"
    onclick="nextQuestion()">
    Question suivante →
</button>

</div>


<!-- RESULTAT -->

<div id="result" class="card hidden">

<h2 id="resultTitle"></h2>

<p id="resultText"></p>

<button class="mode" onclick="backToMenu()">
Rejouer
</button>

</div>

</main>

/* =========================================================
   VARIABLES DU QUIZ
   ========================================================= */

let mode = "";
let questionIndex = 0;
let totalQuestions = 20;
let score = 0;
let streak = 0;

let questionQueue = [];
let currentDepartment = null;
let currentCorrectAnswer = null;
let currentQuestionType = null;
let answered = false;


/* =========================================================
   OUTILS
   ========================================================= */

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}

function getDepartment(code) {
    return departments.find(d => d[0] === code);
}


/*
Retourne les informations sur une ville :
préfecture ou sous-préfecture + département.
*/

function cityInformation(city) {

    for (const d of departments) {

        if (d[2] === city) {

            return `${d[1]} (${d[0]}) — préfecture`;
        }

        if ((subprefectures[d[0]] || []).includes(city)) {

            return `${d[1]} (${d[0]}) — sous-préfecture`;
        }
    }

    return "information non disponible";
}

/* =========================================================
   DEMARRAGE
   ========================================================= */

function startQuiz(selectedMode) {

    mode = selectedMode;

    questionIndex = 0;
    score = 0;
    streak = 0;

    /*
    Une seule occurrence de chaque département dans la
    série initiale : cela évite les répétitions.
    */

    questionQueue = shuffle(departments.map(d => d[0]));

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("result").classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");

    nextQuestion();
}


/* =========================================================
   QUESTION SUIVANTE
   ========================================================= */

function nextQuestion() {

    if (questionIndex >= totalQuestions) {

        finishQuiz();

        return;
    }

    answered = false;

    document.getElementById("nextButton").classList.add("hidden");
    document.getElementById("correction").classList.add("hidden");
    document.getElementById("feedback").textContent = "";

    /*
    On choisit un département encore non utilisé.
    */

    let code = questionQueue.shift();

    currentDepartment = getDepartment(code);

    /*
    En mode mixte, le type de question est tiré au sort.
    */

    if (mode === "mixed") {

        const types = [
            "prefecture",
            "department",
            "subprefecture",
            "status"
        ];

        currentQuestionType =
            types[Math.floor(Math.random() * types.length)];

    } else {

        currentQuestionType = mode;
    }

    questionIndex++;

    generateQuestion();

    updateStats();
}


/* =========================================================
   GENERATION DES QUESTIONS
   ========================================================= */

function generateQuestion() {

    const d = currentDepartment;

    let question = "";
    let correct = "";
    let pool = [];


    /*
    DEPARTEMENT → PREFECTURE
    */

    if (currentQuestionType === "prefecture") {

        question =
            `Quelle est la préfecture du département ${d[1]} (${d[0]}) ?`;

        correct = d[2];

        pool = departments.map(x => x[2]);
    }


    /*
    VILLE → DEPARTEMENT
    */

    else if (currentQuestionType === "department") {

        const subs = subprefectures[d[0]] || [];

        let city;

        if (subs.length && Math.random() < 0.6) {

            city = subs[Math.floor(Math.random() * subs.length)];

        } else {

            city = d[2];
        }

        question =
            `À quel département appartient ${city} ?`;

        correct = d[1];

        pool = departments.map(x => x[1]);
    }


    /*
    SOUS-PREFECTURE → DEPARTEMENT
    */

    else if (currentQuestionType === "subprefecture") {

        const subs = subprefectures[d[0]] || [];

        /*
        Certains départements n'ont pas de sous-préfecture
        dans notre liste. Dans ce cas, on passe au suivant.
        */

        if (!subs.length) {

            questionIndex--;

            questionQueue.push(d[0]);

            nextQuestion();

            return;
        }

        const city =
            subs[Math.floor(Math.random() * subs.length)];

        question =
            `À quel département appartient la sous-préfecture de ${city} ?`;

        correct = d[1];

        pool = departments.map(x => x[1]);
    }


    /*
    PREFECTURE OU SOUS-PREFECTURE
    */

    else if (currentQuestionType === "status") {

        const options = [];

        departments.forEach(dep => {

            options.push({
                city: dep[2],
                type: "Préfecture",
                code: dep[0]
            });

            (subprefectures[dep[0]] || []).forEach(city => {

                options.push({
                    city: city,
                    type: "Sous-préfecture",
                    code: dep[0]
                });

            });

        });

        const chosen =
            options[Math.floor(Math.random() * options.length)];

        window.statusQuestion = chosen;

        question =
            `Quel est le statut administratif de ${chosen.city} ?`;

        correct = chosen.type;

        pool = [
            "Préfecture",
            "Sous-préfecture"
        ];
    }


    currentCorrectAnswer = correct;

    /*
    Création des quatre réponses.
    */

    const uniqueWrongAnswers =
        shuffle(pool.filter(x => x !== correct));

    const answers = shuffle([
        correct,
        ...uniqueWrongAnswers.slice(0, 3)
    ]);

    document.getElementById("question").textContent = question;

    const container =
        document.getElementById("answers");

    container.innerHTML = "";

    answers.forEach(answer => {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = () => {

            checkAnswer(
                button,
                answer,
                correct,
                answers
            );

        };

        container.appendChild(button);

    });
}


/* =========================================================
   REPONSE
   ========================================================= */

function checkAnswer(
    clickedButton,
    answer,
    correct,
    answers
) {

    if (answered) return;

    answered = true;

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(button => {

        button.disabled = true;

        if (button.textContent === correct) {

            button.classList.add("correct");
        }

    });


    const isCorrect =
        answer === correct;


    if (isCorrect) {

        score++;
        streak++;

        clickedButton.classList.add("correct");

        document.getElementById("feedback").textContent =
            "✅ Bonne réponse !";

    } else {

        streak = 0;

        clickedButton.classList.add("wrong");

        document.getElementById("feedback").textContent =
            `❌ Mauvaise réponse. La bonne réponse était : ${correct}`;
    }


    showPropositions(answers);

    showFiche();

    document
        .getElementById("correction")
        .classList.remove("hidden");

    document
        .getElementById("nextButton")
        .classList.remove("hidden");

    updateStats();
}


/* =========================================================
   INFORMATIONS DES QUATRE PROPOSITIONS
   ========================================================= */

function showPropositions(answers) {

    const container =
        document.getElementById("propositions");

    container.innerHTML = "";


    answers.forEach(answer => {

        const div =
            document.createElement("div");

        div.className = "proposition";


        if (answer === currentCorrectAnswer) {

            div.classList.add("correct");
        }


        let information = "";


        /*
        MODE PREFECTURE
        */

        if (currentQuestionType === "prefecture") {

            information =
                cityInformation(answer);
        }


        /*
        MODE DEPARTEMENT
        */

        else if (
            currentQuestionType === "department" ||
            currentQuestionType === "subprefecture"
        ) {

            const dep =
                departments.find(
                    d => d[1] === answer
                );

            if (dep) {

                information =
                    `${dep[1]} (${dep[0]}) — préfecture : ${dep[2]}`;
            }
        }


        /*
        MODE STATUT
        */

        else if (currentQuestionType === "status") {

            const selected =
                window.statusQuestion;

            if (answer === currentCorrectAnswer) {

                information =
                    `${selected.city} appartient au département ${selected.code} et est une ${selected.type.toLowerCase()}.`;

            } else {

                information =
                    "Cette proposition ne correspond pas à la ville demandée.";
            }
        }


        div.innerHTML =
            `${answer === currentCorrectAnswer ? "✅ " : "• "}
             <b>${answer}</b>
             ${information ? " — " + information : ""}`;

        container.appendChild(div);

    });
}


/* =========================================================
   FICHE PEDAGOGIQUE
   ========================================================= */

function showFiche() {

    const d = currentDepartment;

    const text =
        facts[d[0]] ||
        `${d[1]} (${d[0]}) est un département français de la région ${d[3]}. ${d[2]} est sa préfecture.`;

    const container =
        document.getElementById("fiche");


    container.innerHTML = `

        <h3>
            📚 À retenir — ${d[1]} (${d[0]})
        </h3>

        <p>
            <b>Région :</b>
            ${d[3]}
        </p>

        <p>
            <b>Préfecture :</b>
            ${d[2]}
        </p>

        <p>
            ${text}
        </p>

        <a
            href="${departmentURL(d)}"
            target="_blank"
            rel="noopener"
        >
            🔗 Voir la fiche complète de ${d[1]} (${d[0]})
        </a>

    `;
}


/* =========================================================
   STATISTIQUES
   ========================================================= */

function updateStats() {

    document.getElementById("questionNumber").textContent =
        questionIndex;

    document.getElementById("totalQuestions").textContent =
        totalQuestions;

    document.getElementById("score").textContent =
        score;

    document.getElementById("streak").textContent =
        streak;

    document.getElementById("seen").textContent =
        Math.min(questionIndex, 101);

    document.getElementById("progressBar").style.width =
        (questionIndex / totalQuestions * 100) + "%";
}


/* =========================================================
   FIN DU QUIZ
   ========================================================= */

function finishQuiz() {

    document.getElementById("quiz")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.remove("hidden");


    document.getElementById("resultTitle").textContent =
        `Résultat : ${score}/${totalQuestions}`;


    let message;


    if (score === totalQuestions) {

        message =
            "🏆 Score parfait ! Tu maîtrises les départements français.";

    } else if (score >= 17) {

        message =
            "🥇 Excellent !";

    } else if (score >= 14) {

        message =
            "🥈 Très bon niveau !";

    } else if (score >= 10) {

        message =
            "👍 Bonne base, continue !";

    } else {

        message =
            "📚 Il faut encore réviser un peu !";
    }


    document.getElementById("resultText").textContent =
        message;
}


/* =========================================================
   RETOUR AU MENU
   ========================================================= */

function backToMenu() {

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("quiz")
        .classList.add("hidden");

    document.getElementById("menu")
        .classList.remove("hidden");

    questionIndex = 0;
    score = 0;
    streak = 0;

    updateStats();
}
