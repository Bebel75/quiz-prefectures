<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #eef3f8;
  color: #17202a;
}

header {
  background: #173f67;
  color: white;
  padding: 22px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.stats {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

.stat {
  background: #edf2f7;
  padding: 8px 12px;
  border-radius: 10px;
}

.progress {
  height: 8px;
  background: #dce3ea;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 15px;
}

.progress-bar {
  height: 100%;
  width: 0;
  background: #1769aa;
  transition: width .3s;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.mode {
  width: 100%;
  margin: 5px 0;
  background: #1769aa;
  color: white;
}

.answer {
  background: #edf2f7;
  text-align: left;
}

.answer:hover:not(:disabled) {
  background: #dce8f3;
}

.answer.correct {
  background: #d8f3dc;
  color: #176b2c;
}

.answer.wrong {
  background: #fde0e0;
  color: #9b2226;
}

.answer:disabled {
  opacity: 1;
}

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

#question {
  font-size: 21px;
  font-weight: 700;
  margin-bottom: 20px;
}

#feedback {
  margin-top: 15px;
  font-size: 18px;
  font-weight: 700;
}

.hidden {
  display: none;
}

.proposition {
  padding: 12px;
  margin: 7px 0;
  background: #f1f4f7;
  border-radius: 10px;
}

.proposition.correct {
  background: #d8f3dc;
  border-left: 5px solid #2e7d32;
}

.proposition.wrong {
  background: #f8eeee;
}

.fiche {
  margin-top: 20px;
  padding: 18px;
  background: #f7fafc;
  border-left: 5px solid #1769aa;
  border-radius: 10px;
}

.fiche h3 {
  margin-top: 0;
  color: #173f67;
}

.fiche p {
  line-height: 1.55;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 7px;
  background: #e2e8f0;
  margin: 2px;
  font-size: 14px;
}

.small {
  color: #64748b;
  font-size: 14px;
}

@media(max-width:650px) {
  .answers {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🇫🇷 Quiz des départements français</h1>
</header>

<main>

<!-- STATISTIQUES -->

<div class="card">

  <div class="stats">

    <div class="stat">
      Question <b id="questionNumber">0</b>/<span id="totalQuestions">20</span>
    </div>

    <div class="stat">
      Score <b id="score">0</b>
    </div>

    <div class="stat">
      Série <b id="streak">0</b>
    </div>

    <div class="stat">
      Départements vus <b id="seen">0</b>/101
    </div>

  </div>

  <div class="progress">
    <div id="progressBar" class="progress-bar"></div>
  </div>

</div>


<!-- MENU -->

<div id="menu" class="card">

  <h2>Choisis ton mode de quiz</h2>

  <button class="mode" onclick="startQuiz('prefecture')">
    🏛️ Département → préfecture
  </button>

  <button class="mode" onclick="startQuiz('department')">
    📍 Ville → département
  </button>

  <button class="mode" onclick="startQuiz('subprefecture')">
    🏢 Sous-préfecture → département
  </button>

  <button class="mode" onclick="startQuiz('status')">
    ❓ Préfecture ou sous-préfecture ?
  </button>

  <button class="mode" onclick="startQuiz('mixed')">
    🎯 Défi mixte
  </button>

</div>


<!-- QUIZ -->

<div id="quiz" class="card hidden">

  <div id="question"></div>

  <div id="answers" class="answers"></div>

  <div id="feedback"></div>

  <div id="correction" class="hidden">

    <h3>📋 Les quatre propositions</h3>

    <div id="propositions"></div>

    <div id="fiche" class="fiche"></div>

  </div>

  <button
    id="nextButton"
    class="mode hidden"
    onclick="nextQuestion()">
    Question suivante →
  </button>

</div>


<!-- RESULTAT -->

<div id="result" class="card hidden">

  <h2 id="resultTitle"></h2>

  <p id="resultText"></p>

  <button class="mode" onclick="backToMenu()">
    Rejouer
  </button>

</div>

</main>

/* ==========================================================
   VARIABLES
   ========================================================== */

let mode = "";
let questionIndex = 0;
let totalQuestions = 20;
let score = 0;
let streak = 0;
let queue = [];
let currentDepartment = null;
let currentCorrectAnswer = null;
let currentQuestionType = null;
let answered = false;
let currentCity = null;


/* ==========================================================
   UTILITAIRES
   ========================================================== */

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function getDepartment(code) {
  return departments.find(d => d[0] === code);
}

function getDepartmentByName(name) {
  return departments.find(d => d[1] === name);
}


/* ==========================================================
   DEMARRER
   ========================================================== */

function startQuiz(selectedMode) {

  mode = selectedMode;

  questionIndex = 0;
  score = 0;
  streak = 0;

  /*
  On mélange les 101 départements.
  Chaque département ne peut donc apparaître qu'une
  fois avant que la liste soit épuisée.
  */

  queue = shuffle(departments.map(d => d[0]));

  document.getElementById("menu").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  nextQuestion();
}


/* ==========================================================
   QUESTION SUIVANTE
   ========================================================== */

function nextQuestion() {

  if (questionIndex >= totalQuestions) {
    finishQuiz();
    return;
  }

  answered = false;

  document.getElementById("correction").classList.add("hidden");
  document.getElementById("nextButton").classList.add("hidden");
  document.getElementById("feedback").textContent = "";

  currentDepartment = getDepartment(queue.shift());

  if (mode === "mixed") {

    const types = [
      "prefecture",
      "department",
      "subprefecture",
      "status"
    ];

    currentQuestionType =
      types[Math.floor(Math.random() * types.length)];

  } else {

    currentQuestionType = mode;
  }

  /*
  Si le département n'a pas de sous-préfecture,
  on évite le mode sous-préfecture.
  */

  if (
    currentQuestionType === "subprefecture" &&
    (!subprefectures[currentDepartment[0]] ||
     subprefectures[currentDepartment[0]].length === 0)
  ) {

    currentQuestionType = "department";
  }

  questionIndex++;

  generateQuestion();

  updateStats();
}


/* ==========================================================
   GENERER UNE QUESTION
   ========================================================== */

function generateQuestion() {

  const d = currentDepartment;

  let question = "";
  let correct = "";
  let choices = [];


  /* DEPARTEMENT → PREFECTURE */

  if (currentQuestionType === "prefecture") {

    question =
      `Quelle est la préfecture du département ${d[1]} (${d[0]}) ?`;

    correct = d[2];

    choices = departments.map(x => x[2]);
  }


  /* VILLE → DEPARTEMENT */

  else if (currentQuestionType === "department") {

    const subs = subprefectures[d[0]] || [];

    let city;

    if (subs.length > 0 && Math.random() < 0.65) {

      city =
        subs[Math.floor(Math.random() * subs.length)];

    } else {

      city = d[2];
    }

    currentCity = city;

    question =
      `À quel département appartient ${city} ?`;

    correct = d[1];

    choices = departments.map(x => x[1]);
  }


  /* SOUS-PREFECTURE → DEPARTEMENT */

  else if (currentQuestionType === "subprefecture") {

    const subs = subprefectures[d[0]];

    const city =
      subs[Math.floor(Math.random() * subs.length)];

    currentCity = city;

    question =
      `À quel département appartient la sous-préfecture de ${city} ?`;

    correct = d[1];

    choices = departments.map(x => x[1]);
  }


  /* PREFECTURE OU SOUS-PREFECTURE */

  else {

    let city;
    let status;

    /*
    50 % préfecture, 50 % sous-préfecture.
    */

    if (
      Math.random() < 0.5 ||
      !subprefectures[d[0]] ||
      subprefectures[d[0]].length === 0
    ) {

      city = d[2];
      status = "Préfecture";

    } else {

      const subs = subprefectures[d[0]];

      city =
        subs[Math.floor(Math.random() * subs.length)];

      status = "Sous-préfecture";
    }

    currentCity = city;

    question =
      `Quel est le statut administratif de ${city} ?`;

    correct = status;

    choices = [
      "Préfecture",
      "Sous-préfecture"
    ];
  }


  currentCorrectAnswer = correct;


  /*
  Pour le mode statut, seulement 2 réponses.
  Pour les autres modes, 4 réponses.
  */

  if (currentQuestionType === "status") {

    choices = shuffle(choices);

  } else {

    const wrong =
      shuffle(choices.filter(x => x !== correct))
      .slice(0, 3);

    choices =
      shuffle([correct, ...wrong]);
  }


  document.getElementById("question").textContent =
    question;


  const container =
    document.getElementById("answers");

  container.innerHTML = "";


  choices.forEach(choice => {

    const button =
      document.createElement("button");

    button.className = "answer";

    button.textContent = choice;

    button.onclick = () =>
      checkAnswer(button, choice, correct, choices);

    container.appendChild(button);

  });
}


/* ==========================================================
   VERIFIER LA REPONSE
   ========================================================== */

function checkAnswer(
  clickedButton,
  answer,
  correct,
  choices
) {

  if (answered) return;

  answered = true;

  const buttons =
    document.querySelectorAll(".answer");

  buttons.forEach(button => {

    button.disabled = true;

    if (button.textContent === correct) {
      button.classList.add("correct");
    }

  });


  if (answer === correct) {

    score++;
    streak++;

    clickedButton.classList.add("correct");

    document.getElementById("feedback").textContent =
      "✅ Bonne réponse !";

  } else {

    streak = 0;

    clickedButton.classList.add("wrong");

    document.getElementById("feedback").textContent =
      `❌ Mauvaise réponse. La bonne réponse était : ${correct}`;
  }


  showPropositions(choices);

  showFiche();

  document.getElementById("correction")
    .classList.remove("hidden");

  document.getElementById("nextButton")
    .classList.remove("hidden");

  updateStats();
}


/* ==========================================================
   AFFICHAGE DES 4 PROPOSITIONS
   ========================================================== */

function showPropositions(choices) {

  const container =
    document.getElementById("propositions");

  container.innerHTML = "";


  choices.forEach(choice => {

    const div =
      document.createElement("div");

    const isCorrect =
      choice === currentCorrectAnswer;

    div.className =
      "proposition " +
      (isCorrect ? "correct" : "wrong");


    let text = "";


    /*
    QUESTION PREFECTURE
    */

    if (currentQuestionType === "prefecture") {

      const dep =
        departments.find(d => d[2] === choice);

      if (dep) {

        text =
          `${dep[1]} (${dep[0]}) — ${dep[2]} est la préfecture`;
      }
    }


    /*
    QUESTION VILLE → DEPARTEMENT
    */

    else if (
      currentQuestionType === "department" ||
      currentQuestionType === "subprefecture"
    ) {

      const dep =
        getDepartmentByName(choice);

      if (dep) {

        text =
          `${dep[1]} (${dep[0]}) — préfecture : ${dep[2]}`;
      }
    }


    /*
    QUESTION STATUT
    */

    else {

      const city = currentCity;

      let dep = null;
      let status = null;


      departments.forEach(d => {

        if (d[2] === city) {

          dep = d;
          status = "préfecture";
        }

        if (
          (subprefectures[d[0]] || [])
          .includes(city)
        ) {

          dep = d;
          status = "sous-préfecture";
        }

      });


      if (dep) {

        text =
          `${city} appartient au département ${dep[1]} (${dep[0]}) — ${status}`;
      }
    }


    div.innerHTML =
      `<b>${isCorrect ? "✅" : "❌"} ${choice}</b>
       <br>
       <span class="small">${text}</span>`;

    container.appendChild(div);

  });
}


/* ==========================================================
   FICHE PEDAGOGIQUE
   ========================================================== */

function showFiche() {

  const d = currentDepartment;

  const subs =
    subprefectures[d[0]] || [];

  const pedagogicalText =
    facts[d[0]] ||
    `${d[1]} (${d[0]}) appartient à la région ${d[3]}. Sa préfecture est ${d[2]}.`;


  let subprefText = "";

  if (subs.length > 0) {

    subprefText =
      subs.map(city =>
        `<span class="badge">${city}</span>`
      ).join("");

  } else {

    subprefText =
      `<span class="small">Aucune sous-préfecture.</span>`;
  }


  document.getElementById("fiche").innerHTML = `

    <h3>
      📚 À retenir : ${d[1]} (${d[0]})
    </h3>

    <p>
      <b>Région :</b> ${d[3]}
    </p>

    <p>
      <b>Préfecture :</b> ${d[2]}
    </p>

    <p>
      <b>Sous-préfectures :</b><br>
      ${subprefText}
    </p>

    <p>
      ${pedagogicalText}
    </p>

  `;
}


/* ==========================================================
   STATISTIQUES
   ========================================================== */

function updateStats() {

  document.getElementById("questionNumber").textContent =
    questionIndex;

  document.getElementById("totalQuestions").textContent =
    totalQuestions;

  document.getElementById("score").textContent =
    score;

  document.getElementById("streak").textContent =
    streak;

  document.getElementById("seen").textContent =
    Math.min(questionIndex, 101);

  document.getElementById("progressBar").style.width =
    (questionIndex / totalQuestions * 100) + "%";
}


/* ==========================================================
   FIN
   ========================================================== */

function finishQuiz() {

  document.getElementById("quiz")
    .classList.add("hidden");

  document.getElementById("result")
    .classList.remove("hidden");


  document.getElementById("resultTitle").textContent =
    `Résultat : ${score}/${totalQuestions}`;


  let message;

  if (score === totalQuestions) {

    message =
      "🏆 Score parfait ! Tu maîtrises les départements français.";

  } else if (score >= 17) {

    message =
      "🥇 Excellent niveau !";

  } else if (score >= 14) {

    message =
      "🥈 Très bon résultat !";

  } else if (score >= 10) {

    message =
      "👍 Bonne base, continue tes révisions.";

  } else {

    message =
      "📚 Quelques révisions supplémentaires devraient t'aider.";
  }


  document.getElementById("resultText").textContent =
    message;
}


/* ==========================================================
   RETOUR MENU
   ========================================================== */

function backToMenu() {

  document.getElementById("result")
    .classList.add("hidden");

  document.getElementById("quiz")
    .classList.add("hidden");

  document.getElementById("menu")
    .classList.remove("hidden");

  questionIndex = 0;
  score = 0;
  streak = 0;

  updateStats();
}
