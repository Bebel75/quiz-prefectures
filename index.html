<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz des départements français</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #eef3f8;
    color: #17202a;
}

header {
    background: #173f67;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

header p {
    margin: 8px 0 0;
    opacity: .9;
}

main {
    max-width: 950px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.stats {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
}

.stat {
    background: #edf2f7;
    padding: 8px 12px;
    border-radius: 10px;
}

.progress {
    height: 8px;
    background: #dce3ea;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: #1769aa;
    transition: width .3s;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.mode {
    width: 100%;
    margin: 5px 0;
    background: #1769aa;
    color: white;
}

.answer {
    background: #edf2f7;
    text-align: left;
    width: 100%;
    min-height: 58px;
}

.answer:hover:not(:disabled) {
    background: #dce8f3;
}

.answer.correct {
    background: #d8f3dc;
    color: #176b2c;
    border: 2px solid #2e7d32;
}

.answer.wrong {
    background: #fde0e0;
    color: #9b2226;
    border: 2px solid #b3261e;
}

.answer:disabled {
    opacity: 1;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.answer-main {
    font-weight: 700;
    font-size: 16px;
}

#question {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 20px;
    line-height: 1.4;
}

#feedback {
    margin-top: 15px;
    font-size: 17px;
    line-height: 1.5;
}

.hidden {
    display: none !important;
}

.proposition {
    padding: 14px;
    margin: 8px 0;
    background: #f1f4f7;
    border-radius: 10px;
    line-height: 1.5;
}

.proposition.correct {
    background: #d8f3dc;
    border-left: 5px solid #2e7d32;
}

.proposition.wrong {
    background: #f8eeee;
    border-left: 5px solid #b3261e;
}

.proposition-title {
    font-weight: 700;
    font-size: 16px;
}

.proposition-details {
    margin-top: 5px;
    color: #526273;
    font-size: 14px;
}

.fiche {
    margin-top: 20px;
    padding: 18px;
    background: #f7fafc;
    border-left: 5px solid #1769aa;
    border-radius: 10px;
    line-height: 1.55;
}

.fiche h3 {
    margin-top: 0;
    color: #173f67;
}

.fiche h4 {
    color: #245b91;
    margin-bottom: 6px;
}

.savoir {
    background: #fff8df;
    border-left: 5px solid #e0ad19;
    border-radius: 8px;
    padding: 12px;
    margin-top: 15px;
}

.source {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid #dce3ea;
    font-size: 13px;
    color: #64748b;
}

.source a {
    color: #1769aa;
}

.dept-item {
    background: #f1f4f7;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
}

.dept-item strong {
    color: #173f67;
}

.dept-region {
    color: #245b91;
    font-size: 14px;
    margin-top: 3px;
}

#result {
    text-align: center;
}

.result-score {
    font-size: 42px;
    font-weight: 800;
    color: #1769aa;
}

@media(max-width:650px) {
    .answers {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🇫🇷 Quiz des départements français</h1>
    <p>Départements · régions · préfectures · sous-préfectures</p>
</header>

<main>

<div class="card">

    <div class="stats">

        <div class="stat">
            Question <b id="questionNumber">0</b>/<span id="totalQuestions">20</span>
        </div>

        <div class="stat">
            Score <b id="score">0</b>
        </div>

        <div class="stat">
            Série <b id="streak">0</b>
        </div>

        <div class="stat">
            Départements vus <b id="seen">0</b>/101
        </div>

    </div>

    <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
    </div>

</div>


<div id="menu" class="card">

    <h2>🎯 Choisis ton mode de quiz</h2>

    <button class="mode" onclick="startQuiz('prefecture')">
        🏛️ Département → préfecture
    </button>

    <button class="mode" onclick="startQuiz('department')">
        📍 Ville → département
    </button>

    <button class="mode" onclick="startQuiz('subprefecture')">
        🏢 Sous-préfecture → département
    </button>

    <button class="mode" onclick="startQuiz('status')">
        ❓ Préfecture ou sous-préfecture ?
    </button>

    <button class="mode" onclick="startQuiz('mixed')">
        🎯 Défi mixte
    </button>

</div>


<div id="quiz" class="card hidden">

    <div id="question"></div>

    <div id="answers" class="answers"></div>

    <div id="feedback"></div>

    <div id="correction" class="hidden">

        <h3>📋 Correction des propositions</h3>

        <div id="propositions"></div>

        <div id="fiche" class="fiche"></div>

    </div>

    <button id="nextButton"
            class="mode hidden"
            onclick="nextQuestion()">
        Question suivante →
    </button>

</div>


<div id="result" class="card hidden">

    <h2>🏆 Résultat</h2>

    <div id="resultScore" class="result-score"></div>

    <p id="resultText"></p>

    <button class="mode" onclick="backToMenu()">
        Rejouer
    </button>

</div>


<div id="explorer" class="card hidden">

    <h2>📚 Les départements</h2>

    <div id="departmentList"></div>

    <button class="mode" onclick="backToMenu()">
        Retour au quiz
    </button>

</div>

</main>

    let mode = "";
let questionIndex = 0;
let totalQuestions = 20;
let score = 0;
let streak = 0;
let queue = [];
let currentDepartment = null;
let currentCorrectAnswer = null;
let currentQuestionType = null;
let currentCity = null;
let answered = false;
let lastChoices = [];


function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}


function getDepartment(code) {
    return departments.find(d => d.code === code);
}


function getDepartmentByName(name) {
    return departments.find(d => d.name === name);
}


function getDepartmentByPrefecture(city) {
    return departments.find(d => d.prefecture === city);
}


/*
 * Informations administratives affichées APRES la réponse.
 */
function getSubprefectureList(department) {

    const subs =
        subprefectures[department.code] || [];

    if (subs.length === 0) {
        return "Aucune sous-préfecture renseignée.";
    }

    return subs.join(", ");
}


function getAdministrativeDetails(department) {

    return `
        <div class="proposition-details">

            <strong>Département :</strong>
            ${department.name} (${department.code})<br>

            <strong>Région :</strong>
            ${department.region}<br>

            <strong>Préfecture :</strong>
            ${department.prefecture}<br>

            <strong>Sous-préfectures :</strong>
            ${getSubprefectureList(department)}

        </div>
    `;
}


function startQuiz(selectedMode) {

    mode = selectedMode;

    questionIndex = 0;
    score = 0;
    streak = 0;
    answered = false;

    queue = shuffle(
        departments.map(d => d.code)
    );

    document.getElementById("menu")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("explorer")
        .classList.add("hidden");

    document.getElementById("quiz")
        .classList.remove("hidden");

    nextQuestion();
}


function nextQuestion() {

    if (questionIndex >= totalQuestions) {

        finishQuiz();

        return;
    }

    answered = false;

    document.getElementById("correction")
        .classList.add("hidden");

    document.getElementById("nextButton")
        .classList.add("hidden");

    document.getElementById("feedback")
        .textContent = "";

    currentDepartment =
        getDepartment(queue.shift());

    if (mode === "mixed") {

        const types = [
            "prefecture",
            "department",
            "subprefecture",
            "status"
        ];

        currentQuestionType =
            types[Math.floor(Math.random() * types.length)];

    } else {

        currentQuestionType = mode;
    }


    if (
        currentQuestionType === "subprefecture" &&
        (!subprefectures[currentDepartment.code] ||
         subprefectures[currentDepartment.code].length === 0)
    ) {

        currentQuestionType = "department";
    }


    questionIndex++;

    generateQuestion();

    updateStats();
}


function generateQuestion() {

    const d = currentDepartment;

    let question = "";
    let correct = "";
    let choices = [];


    if (currentQuestionType === "prefecture") {

        question =
            `Quelle est la préfecture du département ${d.name} (${d.code}), situé en ${d.region} ?`;

        correct = d.prefecture;

        choices = departments.map(
            x => x.prefecture
        );

    }


    else if (currentQuestionType === "department") {

        const subs =
            subprefectures[d.code] || [];

        let city;

        if (
            subs.length > 0 &&
            Math.random() < 0.65
        ) {

            city =
                subs[Math.floor(Math.random() * subs.length)];

        } else {

            city = d.prefecture;
        }

        currentCity = city;

        question =
            `À quel département appartient ${city} ?`;

        correct = d.name;

        choices = departments.map(
            x => x.name
        );

    }


    else if (currentQuestionType === "subprefecture") {

        const subs =
            subprefectures[d.code];

        const city =
            subs[Math.floor(Math.random() * subs.length)];

        currentCity = city;

        question =
            `À quel département appartient la sous-préfecture de ${city} ?`;

        correct = d.name;

        choices = departments.map(
            x => x.name
        );

    }


    else {

        let city;
        let status;

        if (
            Math.random() < 0.5 ||
            !subprefectures[d.code] ||
            subprefectures[d.code].length === 0
        ) {

            city = d.prefecture;
            status = "Préfecture";

        } else {

            const subs =
                subprefectures[d.code];

            city =
                subs[Math.floor(Math.random() * subs.length)];

            status = "Sous-préfecture";
        }

        currentCity = city;

        question =
            `Quel est le statut administratif de ${city} ?`;

        correct = status;

        choices = [
            "Préfecture",
            "Sous-préfecture"
        ];
    }


    currentCorrectAnswer = correct;


    if (currentQuestionType === "status") {

        choices = shuffle(choices);

    } else {

        const wrong =
            shuffle(
                choices.filter(
                    x => x !== correct
                )
            ).slice(0, 3);

        choices =
            shuffle([
                correct,
                ...wrong
            ]);
    }


    lastChoices = choices;

    document.getElementById("question")
        .textContent = question;


    const container =
        document.getElementById("answers");

    container.innerHTML = "";


    choices.forEach(choice => {

        const button =
            document.createElement("button");

        button.className = "answer";


        /*
         * IMPORTANT :
         * aucune information permettant d'identifier
         * le département n'apparaît ici.
         *
         * Une proposition est simplement :
         * "Lyon", "Besançon", "Ain", etc.
         */

        button.innerHTML = `
            <span class="answer-main">
                ${choice}
            </span>
        `;


        button.onclick = () =>
            checkAnswer(
                button,
                choice,
                correct,
                choices
            );


        container.appendChild(button);

    });
}


function checkAnswer(
    clickedButton,
    answer,
    correct,
    choices
) {

    if (answered) return;

    answered = true;

    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(button => {

        button.disabled = true;

    });


    if (answer === correct) {

        score++;
        streak++;

        clickedButton
            .classList
            .add("correct");

        document.getElementById("feedback")
            .textContent =
            "✅ Bonne réponse !";

    } else {

        streak = 0;

        clickedButton
            .classList
            .add("wrong");


        /*
         * La bonne réponse n'est expliquée
         * qu'après le choix.
         */

        if (
            currentQuestionType === "prefecture"
        ) {

            document.getElementById("feedback")
                .textContent =
                `❌ Mauvaise réponse. La bonne réponse était ${currentCorrectAnswer}.`;

        }

        else if (
            currentQuestionType === "department" ||
            currentQuestionType === "subprefecture"
        ) {

            document.getElementById("feedback")
                .textContent =
                `❌ Mauvaise réponse. Le bon département était ${currentDepartment.name} (${currentDepartment.code}).`;

        }

        else {

            document.getElementById("feedback")
                .textContent =
                `❌ Mauvaise réponse. La bonne réponse était ${correct}.`;
        }
    }


    showPropositions(choices);

    showFiche();


    document.getElementById("correction")
        .classList
        .remove("hidden");


    document.getElementById("nextButton")
        .classList
        .remove("hidden");


    updateStats();
}


/*
 * CORRECTION DES QUATRE PROPOSITIONS
 *
 * C'est ici que les informations détaillées
 * apparaissent seulement après la réponse.
 */
function showPropositions(choices) {

    const container =
        document.getElementById("propositions");

    container.innerHTML = "";


    choices.forEach(choice => {

        const div =
            document.createElement("div");

        const isCorrect =
            choice === currentCorrectAnswer;

        div.className =
            "proposition " +
            (isCorrect
                ? "correct"
                : "wrong");


        let title = "";
        let details = "";


        /*
         * QUESTION : département → préfecture
         */
        if (
            currentQuestionType === "prefecture"
        ) {

            const dep =
                getDepartmentByPrefecture(choice);

            if (dep) {

                title =
                    `${isCorrect ? "✅" : "❌"} ${dep.prefecture}`;

                details = getAdministrativeDetails(dep);

            } else {

                title =
                    `${isCorrect ? "✅" : "❌"} ${choice}`;
            }
        }


        /*
         * QUESTION : ville → département
         *
         * Ici chaque proposition est un département.
         */
        else if (
            currentQuestionType === "department" ||
            currentQuestionType === "subprefecture"
        ) {

            const dep =
                getDepartmentByName(choice);

            if (dep) {

                title =
                    `${isCorrect ? "✅" : "❌"} ${dep.name} (${dep.code})`;

                details =
                    getAdministrativeDetails(dep);

            } else {

                title =
                    `${isCorrect ? "✅" : "❌"} ${choice}`;
            }
        }


        /*
         * QUESTION : préfecture ou sous-préfecture
         */
        else {

            const city = currentCity;

            let dep = null;
            let status = null;


            departments.forEach(d => {

                if (d.prefecture === city) {

                    dep = d;
                    status = "Préfecture";
                }

                if (
                    (subprefectures[d.code] || [])
                        .includes(city)
                ) {

                    dep = d;
                    status = "Sous-préfecture";
                }

            });


            title =
                `${isCorrect ? "✅" : "❌"} ${city}`;

            if (dep) {

                details = `
                    <div class="proposition-details">

                        <strong>Statut :</strong>
                        ${status}<br>

                        ${getAdministrativeDetails(dep)}

                    </div>
                `;
            }
        }


        div.innerHTML = `
            <div class="proposition-title">
                ${title}
            </div>
            ${details}
        `;


        container.appendChild(div);

    });
}


/*
 * FICHE PÉDAGOGIQUE
 */
function showFiche() {

    const d = currentDepartment;

    document.getElementById("fiche")
        .innerHTML = `

        <h3>
            📚 ${d.name} (${d.code})
        </h3>

        <p>
            <strong>Région :</strong>
            ${d.region}
        </p>

        <p>
            <strong>Préfecture :</strong>
            ${d.prefecture}

        <p>
            <strong>Sous-préfectures :</strong><br>
            ${getSubprefectureList(d)}
        </p>

        <h4>

        </h4>

        <p>
            ${d.intro}
        </p>

        <h4>
            La préfecture : ${d.prefecture}
        </h4>

        <p>
            ${d.prefectureText}
        </p>

        <div class="savoir">

            <h4>
                💡 Le saviez-vous ?
            </h4>

            <p>
                ${d.fact}
            </p>

        </div>

        ${SOURCE_HTML}

    `;
}


function getSubprefectureList(department) {

    const subs =
        subprefectures[department.code] || [];

    if (subs.length === 0) {

        return `
            <span class="small">
                Aucune sous-préfecture renseignée.
            </span>
        `;
    }

    return subs.join(", ");
}


function updateStats() {

    document.getElementById("questionNumber")
        .textContent = questionIndex;

    document.getElementById("totalQuestions")
        .textContent = totalQuestions;

    document.getElementById("score")
        .textContent = score;

    document.getElementById("streak")
        .textContent = streak;

    document.getElementById("seen")
        .textContent =
        Math.min(questionIndex, 101);

    document.getElementById("progressBar")
        .style.width =
        (questionIndex / totalQuestions * 100)
        + "%";
}
    function finishQuiz() {

    document.getElementById("quiz")
        .classList
        .add("hidden");

    document.getElementById("result")
        .classList
        .remove("hidden");


    document.getElementById("resultScore")
        .textContent =
        `${score}/${totalQuestions}`;


    const percentage =
        Math.round(
            score / totalQuestions * 100
        );


    let message;


    if (percentage === 100) {

        message =
            "🏆 Score parfait ! Tu maîtrises les départements français.";

    } else if (percentage >= 85) {

        message =
            "🥇 Excellent niveau !";

    } else if (percentage >= 70) {

        message =
            "🥈 Très bon résultat !";

    } else if (percentage >= 50) {

        message =
            "👍 Bonne base, continue tes révisions.";

    } else {

        message =
            "📚 Quelques révisions supplémentaires devraient t'aider.";
    }


    document.getElementById("resultText")
        .textContent =
        `${message} (${percentage} % de réussite)`;
}


function backToMenu() {

    document.getElementById("result")
        .classList
        .add("hidden");

    document.getElementById("quiz")
        .classList
        .add("hidden");

    document.getElementById("explorer")
        .classList
        .add("hidden");

    document.getElementById("menu")
        .classList
        .remove("hidden");


    questionIndex = 0;
    score = 0;
    streak = 0;

    updateStats();
}


function showExplorer() {

    document.getElementById("menu")
        .classList
        .add("hidden");

    document.getElementById("quiz")
        .classList
        .add("hidden");

    document.getElementById("result")
        .classList
        .add("hidden");

    document.getElementById("explorer")
        .classList
        .remove("hidden");


    const list =
        document.getElementById(
            "departmentList"
        );

    list.innerHTML = "";


    departments
        .slice()
        .sort((a,b) =>
            a.code.localeCompare(
                b.code,
                "fr",
                {numeric:true}
            )
        )
        .forEach(d => {

            const item =
                document.createElement("div");

            item.className =
                "dept-item";


            item.innerHTML = `
                <strong>
                    ${d.name} (${d.code})
                </strong>

                <div class="dept-region">
                    Région : ${d.region}
                </div>

                <div>
                    Préfecture : ${d.prefecture}
                </div>

                <button
                    class="mode"
                    style="margin-top:8px;"
                    onclick="showStandaloneFiche('${d.code}')">
                    📚 Voir la fiche
                </button>
            `;


            list.appendChild(item);

        });
}


function showStandaloneFiche(code) {

    const d =
        getDepartment(code);

    if (!d) return;


    document.getElementById("menu")
        .classList
        .add("hidden");

    document.getElementById("quiz")
        .classList
        .add("hidden");

    document.getElementById("result")
        .classList
        .add("hidden");

    document.getElementById("explorer")
        .classList
        .remove("hidden");


    const list =
        document.getElementById(
            "departmentList"
        );


    list.innerHTML = `

        <div class="fiche">

            <h3>
                📚 ${d.name} (${d.code})
            </h3>

            <p>
                <strong>Région :</strong>
                ${d.region}
            </p>

            <p>
                <strong>Préfecture :</strong>
                ${d.prefecture}
            </p>

            <p>
                <strong>Sous-préfectures :</strong><br>
                ${getSubprefectureList(d)}
            </p>

            <h4>
                Le département ${d.name} (${d.code})
            </h4>

            <p>
                ${d.intro}
            </p>

            <h4>
                La préfecture : ${d.prefecture}
            </h4>

            <p>
                ${d.prefectureText}
            </p>

            <div class="savoir">

                <h4>
                    💡 Le saviez-vous ?
                </h4>

                <p>
                    ${d.fact}
                </p>

            </div>

            ${SOURCE_HTML}

            <button
                class="mode"
                onclick="showExplorer()">
                ← Retour à la liste
            </button>

        </div>
    `;
}
